[project]
name = "mary-brain"
version = "0.1.0"
description = "Mary — WhatsApp AI brain. LangGraph OSS + FastAPI, self-hosted, talks to Evolution API directly."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "langsmith>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

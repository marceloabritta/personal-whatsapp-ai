# ============================================================================
#  Full stack: Evolution API (WhatsApp gateway) + Postgres + Redis +
#  dispatcher + Lisa (@lisa) + Mary (@mary). Runs on a single droplet.
#  Everything talks over the internal "evolution-net".
#
#  NB: this file is the canonical record of what runs in production. The droplet
#  deploys it as a base compose (api/redis/postgres) + a docker-compose.override.yml
#  (dispatcher/lisa/mary) whose only intentional difference is ABSOLUTE build
#  contexts under /opt/personal-whatsapp-ai (this file uses repo-relative paths).
#  Env, models, ports and versions here mirror the live override — keep them in sync.
# ============================================================================
services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
      - postgres
    ports:
      - "8080:8080"          # Evolution manager/API (exposed to the internet)
    volumes:
      - evolution_instances:/evolution/instances
    env_file:
      - .env                  # Evolution config (secrets, database, cache)
    networks:
      - evolution-net

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net

  postgres:
    container_name: evolution_postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c max_connections=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  # ── ONE NUMBER, TAG-ROUTED ─────────────────────────────────────────────────
  # One Evolution instance posts every message to ONE webhook. The `dispatcher`
  # is that single target; it reads the summon @tag (and per-chat window
  # ownership) and forwards the raw payload to the flow that owns the turn:
  #   @lisa → lisa  (LangGraph brain — the core flow)
  #   @mary → mary  (experimental programmatic orchestrator)
  # To add a new experimental flow, add its service below, then wire a new
  # @tag → its URL in the dispatcher env — the core @lisa flow stays untouched.
  # The retired Node "secretary"/"Mary" flow is preserved on archive/secretary-v1.

  dispatcher:
    container_name: flow_dispatcher
    build:
      context: ../dispatcher
    restart: always
    depends_on:
      - api
      - redis
      - lisa
      - mary
    ports:
      - "127.0.0.1:8090:8090" # the ONE webhook Evolution posts to (localhost-bound; reached in-net via DNS)
    environment:
      OWNER_NAME: "Marcelo"
      # Window TTL for untagged continuations. Keep >= each flow's own window so a
      # valid continuation is never dropped before the flow's gate would close it.
      WINDOW_TTL: "120"
      # Own DB index, clear of Evolution's cache and the flows' session stores.
      REDIS_URL: redis://redis:6379/4
      # tag → flow wiring (forwarded by Docker service DNS on evolution-net).
      # A new flow adds NEW_TAGS + NEW_URL here; @lisa stays untouched.
      LISA_TAGS: "@lisa"
      LISA_URL: http://lisa:8000/webhook
      # @mary — the experimental orchestrator flow (calendar + web skills).
      MARY_TAGS: "@mary"
      MARY_URL: http://mary:8000/webhook
    networks:
      - evolution-net

  # @lisa — the LangGraph brain (Python). The core flow: calendar, audio, PDFs,
  # images. Redis DB 1; Postgres checkpointer + its own lisa_log schema.
  lisa:
    container_name: lisa_brain
    build:
      context: ../Lisa flow     # the LangGraph brain (Python) lives in ../Lisa flow
    restart: always
    depends_on:
      - api
      - redis
      - postgres
    ports:
      # Debug only (dispatcher reaches lisa via service DNS on :8000 internally).
      # 8001 on the host to avoid clashing with the old mary_brain on 8000.
      - "127.0.0.1:8001:8000"
    environment:
      EVOLUTION_URL: http://api:8080
      EVOLUTION_APIKEY: ${AUTHENTICATION_API_KEY}
      EVOLUTION_INSTANCE: secretaria
      # Reply header is [<OWNER_NAME>'s AI Assistant]:
      OWNER_NAME: "Marcelo"
      # Trigger tag (comma-separated, lowercase). @lisa wakes the brain.
      MARY_TRIGGER_TAG: "@lisa"
      # Listening-window marker + webhook dedup. Own DB, clear of Evolution's cache.
      REDIS_URL: redis://redis:6379/1
      LOOP_TTL_SECONDS: "60"
      # Memory: seed size + the LangGraph checkpointer (reuses the Evolution Postgres).
      CONTEXT_WINDOW_MESSAGES: "30"
      DATABASE_URL: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      LOG_SCHEMA: lisa_log
      # Media context (images & PDFs as inline base64) — on in production.
      MEDIA_ENABLED: "true"
      # Reasoning (provider-neutral; Anthropic today).
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: claude-sonnet-5
      CLAUDE_EFFORT: high
      CLAUDE_MAX_TOKENS: "10000"
      WEB_SEARCH_MAX_USES: "5"
      PROMPT_VERSION: "2026-08-05-programmatic-calendar"
      # Transcription (AssemblyAI).
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      ASSEMBLYAI_LANGUAGE: auto
      # Tools
      MAX_TOOL_ACTIONS: "4"
      # Durable loop-log HTTP token.
      LOG_API_TOKEN: ${LOG_API_TOKEN}
      # Google calendar tool (owner's account)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      CALENDAR_TIMEZONE: America/Sao_Paulo
    networks:
      - evolution-net

  # @mary — the experimental programmatic-orchestrator brain (calendar + web skills).
  # ISOLATED from @lisa so a test flow can never corrupt the core one:
  #   - own Redis DB (2) for its listening window + echo store (Lisa uses DB 1);
  #   - own POSTGRES DATABASE (`mary`), not merely its own schema. The checkpointer keys
  #     threads on sha256(instance:chat_jid), which is IDENTICAL across flows for the same
  #     chat, so a shared database would put Mary and Lisa on ONE thread row per chat
  #     (messages, pending_action, loop_domain, session_lang) and a fresh-tag reset would
  #     wipe the other's history. A separate database isolates the checkpoint tables, the
  #     durable loop log (mary_log) and the transcript cache in one move, with no code
  #     change — identity between the two flows stays env-only.
  #     Created once with: CREATE DATABASE mary OWNER evolution;
  # Same WhatsApp number/account; the dispatcher routes @mary here, @lisa stays on lisa.
  mary:
    container_name: mary_brain
    build:
      context: ../Mary flow
    restart: always
    depends_on:
      - api
      - redis
      - postgres
    environment:
      EVOLUTION_URL: http://api:8080
      EVOLUTION_APIKEY: ${AUTHENTICATION_API_KEY}
      EVOLUTION_INSTANCE: secretaria
      OWNER_NAME: "Marcelo"
      # @mary wakes this brain.
      MARY_TRIGGER_TAG: "@mary"
      # Own Redis DB, clear of Lisa's (1), Evolution's cache, and the dispatcher's (4).
      REDIS_URL: redis://redis:6379/2
      LOOP_TTL_SECONDS: "60"
      # Memory: seed size + the LangGraph checkpointer + the durable loop log. Own DB
      # (`mary`), never Lisa's `evolution` — see the isolation note above.
      CONTEXT_WINDOW_MESSAGES: "30"
      DATABASE_URL: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/mary
      LOG_SCHEMA: mary_log
      MEDIA_ENABLED: "true"
      # Reasoning (provider-neutral; Anthropic today).
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: claude-sonnet-5
      CLAUDE_EFFORT: high
      CLAUDE_MAX_TOKENS: "10000"
      WEB_SEARCH_MAX_USES: "5"
      PROMPT_VERSION: "2026-08-05-programmatic-calendar"
      # Programmatic domain orchestrator.
      DEFAULT_DOMAIN: web
      ROUTER_EFFORT: low
      MAX_TOOL_ACTIONS: "4"
      # Transcription (AssemblyAI).
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      ASSEMBLYAI_LANGUAGE: auto
      # Google calendar tool (owner's account — same as Lisa; confirmation-gated).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      CALENDAR_TIMEZONE: America/Sao_Paulo
    networks:
      - evolution-net

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:

networks:
  evolution-net:
    driver: bridge

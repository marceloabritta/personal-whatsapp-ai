# ============================================================================
#  Full stack: Evolution API (WhatsApp gateway) + Postgres + Redis + secretary
#  Runs on a single droplet. Everything talks over the internal "evolution-net".
# ============================================================================
services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
      - postgres
    ports:
      - "8080:8080"          # Evolution manager/API (exposed to the internet)
    volumes:
      - evolution_instances:/evolution/instances
    env_file:
      - .env                  # Evolution config (secrets, database, cache)
    networks:
      - evolution-net

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net

  postgres:
    container_name: evolution_postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c max_connections=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  # The old Node "secretary" orchestrator is RETIRED — replaced by "brain" below.
  # Its full source is preserved on the git branch `archive/secretary-v1`.

  brain:
    container_name: mary_brain
    build:
      context: ../brain        # the LangGraph brain (Python) lives in ../brain
    restart: always
    depends_on:
      - api
      - redis
      - postgres
    environment:
      EVOLUTION_URL: http://api:8080
      EVOLUTION_APIKEY: ${AUTHENTICATION_API_KEY}
      EVOLUTION_INSTANCE: secretaria
      # Reply header is [<OWNER_NAME>'s AI Assistant]:
      OWNER_NAME: "Marcelo"
      # Trigger tag (comma-separated, lowercase). @mary wakes the brain.
      MARY_TRIGGER_TAG: "@mary"
      # Listening-window marker + webhook dedup. Own DB, clear of Evolution's cache.
      REDIS_URL: redis://redis:6379/1
      LOOP_TTL_SECONDS: "60"
      # Memory: seed size + the LangGraph checkpointer (reuses the Evolution Postgres).
      CONTEXT_WINDOW_MESSAGES: "30"
      DATABASE_URL: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      # Reasoning (provider-neutral; Anthropic today).
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: claude-opus-4-8
      CLAUDE_EFFORT: high
      WEB_SEARCH_MAX_USES: "5"
      PROMPT_VERSION: "2026-08-02.2"
    networks:
      - evolution-net

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:

networks:
  evolution-net:
    driver: bridge

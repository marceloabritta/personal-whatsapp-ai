# ============================================================================
#  Full stack: Evolution API (WhatsApp gateway) + Postgres + Redis +
#  dispatcher + Lisa (@lisa). Runs on a single droplet.
#  Everything talks over the internal "evolution-net".
#
#  NB: this file is the canonical record of what runs in production. The droplet
#  deploys it as a base compose (api/redis/postgres) + a docker-compose.override.yml
#  (dispatcher/lisa) whose only intentional difference is ABSOLUTE build
#  contexts under /opt/personal-whatsapp-ai (this file uses repo-relative paths).
#  Env, models, ports and versions here mirror the live override — keep them in sync.
# ============================================================================
services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - redis
      - postgres
    ports:
      - "8080:8080"          # Evolution manager/API (exposed to the internet)
    volumes:
      - evolution_instances:/evolution/instances
    env_file:
      - .env                  # Evolution config (secrets, database, cache)
    networks:
      - evolution-net

  redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net

  postgres:
    container_name: evolution_postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c max_connections=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  # ── ONE NUMBER, TAG-ROUTED ─────────────────────────────────────────────────
  # One Evolution instance posts every message to ONE webhook. The `dispatcher`
  # is that single target; it reads the summon @tag (and per-chat window
  # ownership) and forwards the raw payload to the flow that owns the turn:
  #   @lisa → lisa  (LangGraph brain — the only flow today)
  # To add an experimental flow, add its service below, a (tags, url) route in
  # dispatcher/app.py, and its @tag → URL in the dispatcher env — the core @lisa
  # flow stays untouched.
  # Retired: the Node "secretary"/"Mary" flow (branch archive/secretary-v1) and the
  # experimental @mary orchestrator (in history: git log -- "Mary flow").

  dispatcher:
    container_name: flow_dispatcher
    build:
      context: ../dispatcher
    restart: always
    depends_on:
      - api
      - redis
      - lisa
    ports:
      - "127.0.0.1:8090:8090" # the ONE webhook Evolution posts to (localhost-bound; reached in-net via DNS)
    environment:
      OWNER_NAME: "Marcelo"
      # Window TTL for untagged continuations. Keep >= each flow's own window so a
      # valid continuation is never dropped before the flow's gate would close it.
      # It counts from the last HUMAN message (a flow's reply never refreshes it), while
      # Lisa's 5-minute AWAIT_WINDOW_SECONDS counts from her reply — so it is that window
      # plus two minutes for her to reason and send.
      WINDOW_TTL: "420"
      # Own DB index, clear of Evolution's cache and the flows' session stores.
      REDIS_URL: redis://redis:6379/4
      # tag → flow wiring (forwarded by Docker service DNS on evolution-net).
      # A new flow adds NEW_TAGS + NEW_URL here; @lisa stays untouched.
      LISA_TAGS: "@lisa"
      LISA_URL: http://lisa:8000/webhook
    networks:
      - evolution-net

  # @lisa — the LangGraph brain (Python). The core flow: calendar, audio, PDFs,
  # images. Redis DB 1; Postgres checkpointer + its own lisa_log schema.
  lisa:
    container_name: lisa_brain
    build:
      context: ../Lisa flow     # the LangGraph brain (Python) lives in ../Lisa flow
    restart: always
    # How long Docker waits after SIGTERM before it kills her. She uses up to 100 s of it to
    # finish the turns in flight (--timeout-graceful-shutdown in her Dockerfile) and the rest
    # to close her stores. Docker's default is 10 s, shorter than most web answers. With no
    # turn in flight she exits at once, so a deploy is only slower when it would have cut one.
    stop_grace_period: 120s
    depends_on:
      - api
      - redis
      - postgres
    ports:
      # Debug only (dispatcher reaches lisa via service DNS on :8000 internally).
      # 8001 on the host, kept from when the retired mary_brain held 8000.
      - "127.0.0.1:8001:8000"
    environment:
      EVOLUTION_URL: http://api:8080
      EVOLUTION_APIKEY: ${AUTHENTICATION_API_KEY}
      EVOLUTION_INSTANCE: secretaria
      # Reply header is [<OWNER_NAME>'s AI Assistant]:
      OWNER_NAME: "Marcelo"
      # Trigger tag (comma-separated, lowercase). @lisa wakes the brain.
      MARY_TRIGGER_TAG: "@lisa"
      # Listening-window marker + webhook dedup. Own DB, clear of Evolution's cache.
      REDIS_URL: redis://redis:6379/1
      LOOP_TTL_SECONDS: "60"
      # While she waits on an answer (a confirmation card, an email, a date) — 5 minutes.
      AWAIT_WINDOW_SECONDS: "300"
      # Memory: seed size + the LangGraph checkpointer (reuses the Evolution Postgres).
      CONTEXT_WINDOW_MESSAGES: "30"
      DATABASE_URL: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      LOG_SCHEMA: lisa_log
      # Media context (images & PDFs as inline base64) — on in production.
      MEDIA_ENABLED: "true"
      # Reasoning (provider-neutral; Anthropic today).
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: claude-sonnet-5
      CLAUDE_EFFORT: high
      CLAUDE_MAX_TOKENS: "10000"
      WEB_SEARCH_MAX_USES: "5"
      # Anthropic prompt caching: the part of a prompt that repeats from one call to the next is
      # read back at a tenth of the input price. "false" sends the requests as they were before.
      PROMPT_CACHE_ENABLED: "true"
      PROMPT_VERSION: "2026-11-10-last-used-address"
      # Automatic transcription — the roster-driven ambient path. Nothing is transcribed until
      # a chat is enrolled via "@lisa setup" in the chat with myself.
      AUTO_TRANSCRIBE_ENABLED: "true"
      AUTO_TRANSCRIBE_MAX_SECONDS: "600"
      AUTO_TRANSCRIBE_DAILY_CAP: "40"
      AUTO_TRANSCRIBE_REPORT_FAILURES: "false"
      AUTO_TRANSCRIBE_QUOTE_REPLY: "true"
      SETUP_WINDOW_SECONDS: "300"
      # Meeting presets, set from "@lisa setup": standard length, video call, guest emails and
      # saved places. Stored in lisa_log.owner_presets; an unset preset books as before.
      PRESETS_ENABLED: "true"
      # Before a booking's card, his calendar is read for that time. When he already has something
      # then, no card goes out: she says he is not free, never what the other thing is, and may
      # offer one other time. "false" shows the card without looking, as before.
      BUSY_CHECK_ENABLED: "true"
      # Session review — grades each turn once a session closes (app/review/). Reads the log,
      # writes only its own tables; nothing in the reply path awaits it. Scoped to the current
      # prompt_version so it never re-grades turns from code that no longer exists.
      REVIEW_ENABLED: "true"
      REVIEW_SCOPE_VERSION: "2026-11-10-last-used-address"
      REVIEW_JUDGE_VERSION: "v5"
      REVIEW_MODEL: claude-opus-4-8
      # Transcription (AssemblyAI).
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      ASSEMBLYAI_LANGUAGE: auto
      # Tools
      MAX_TOOL_ACTIONS: "4"
      # Durable loop-log HTTP token.
      LOG_API_TOKEN: ${LOG_API_TOKEN}
      # Google calendar tool (owner's account)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      CALENDAR_TIMEZONE: America/Sao_Paulo
      # Contact memory — Lisa reads the address book on calendar turns and writes back the
      # addresses she learns. It has its OWN refresh token: google-auth only warns on a
      # missing scope, so reissuing the calendar one to add contacts would risk the live
      # calendar.
      CONTACTS_ENABLED: "true"
      GOOGLE_CONTACTS_REFRESH_TOKEN: ${GOOGLE_CONTACTS_REFRESH_TOKEN}
      CONTACTS_DEFAULT_REGION: "BR"
      # Creating BRAND-NEW people in the real address book is held off for the first run. The
      # trigger is only "a two-token name with no match", so "a Ana Silva da contabilidade,
      # contato@escritorio.com.br" would mint a contact. Learning addresses for people already
      # in the book is unaffected and fully on. Flip to "true" to enable.
      CONTACTS_CREATE_PEOPLE: "false"
      # The contacts skill: find, create, update and delete on his say-so, card by card, and the
      # calendar's ability to call it mid-booking. Separate from the silent learning above. On
      # since 2026-11-10, after tests/live_contacts.py wrote to and deleted a throwaway contact.
      CONTACTS_CRUD_ENABLED: "true"
    networks:
      - evolution-net

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:

networks:
  evolution-net:
    driver: bridge
